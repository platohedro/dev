name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate Supabase migrations
        run: pnpm test:migrations

      - name: Validate SEO configuration
        run: pnpm test:seo

      - name: Build production bundle
        run: pnpm build

      - name: Audit dependencies
        continue-on-error: true
        run: pnpm audit --audit-level=moderate

  database:
    name: Validate Supabase from clean database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Stop any previous local Supabase
        run: supabase stop || true
      - name: Start local Supabase
        run: supabase start

      - name: Apply all migrations from clean state
        run: supabase db reset --yes

      - name: Stop local Supabase
        if: always()
        run: supabase stop
